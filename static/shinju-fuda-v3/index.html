<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0d1427">
  <title>神獣札</title>
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="effects.css?v=2">
</head>
<body>
  <main id="game">
    <header><h1>神 獣 札</h1><p>第一印　黄昏の社</p></header>
    <button id="book-button" class="book-button">札帳 <b id="book-count">1</b></button>

    <section id="explore" class="screen active">
      <div class="notice"><b>近くで神印が震えている</b><span>参道の奥から、禍獣の気配……</span></div>
      <button id="sense" class="sense"><i>✦</i><span>気配を調べる</span></button>
      <div class="journey">
        <span class="done">夕凪神社</span><i></i><button id="river-node">水元河川敷</button><i></i><span class="locked-node">古い商店街</span>
      </div>
      <p class="guide">光る場所をタップして探索</p>
    </section>

    <section id="battle" class="screen">
      <div class="enemy-hud"><span>禍獣　影喰いの獏　Lv.3</span><div class="bar"><i id="enemy-hp"></i></div></div>
      <div id="enemy" class="enemy"><img src="assets/kagekui.png" alt="影喰いの獏"><b>影喰いの獏</b></div>
      <div id="fx" class="fx" aria-hidden="true"></div>
      <div id="battle-effect" class="battle-effect" aria-hidden="true"><i></i><i></i><i></i></div>
      <div id="seal-throw" class="seal-throw" aria-hidden="true">封</div>
      <button id="card" class="card"><small>神獣札</small><strong>炎狐<br>コハク</strong><em>封</em></button>
      <img id="kohaku" class="kohaku" src="assets/kohaku.png" alt="炎狐コハク">
      <div class="command">
        <p id="message">禍獣が姿を現した！<br>神獣札をタップして相棒を呼ぼう。</p>
        <div id="player-bar" class="bar player hidden"><i id="player-hp"></i></div>
        <div id="actions" class="actions hidden">
          <button data-move="狐火" data-damage="24">狐火</button>
          <button data-move="印返し" data-damage="15">印返し</button>
          <button data-move="見切る" data-damage="0">見切る</button>
          <button id="switch-action">交代</button>
        </div>
        <button id="seal-action" class="seal-action hidden">神獣札を投げる<br><small>捕獲率 15%</small></button>
      </div>
      <div id="switch-panel" class="switch-panel hidden">
        <b>交代する神獣を選ぶ</b>
        <button data-beast="kohaku"><img src="assets/kohaku.png" alt="">炎狐 コハク</button>
        <button id="switch-muu" data-beast="muu"><img src="assets/kagekui.png" alt="">夢獏 ムウ</button>
        <button id="switch-close">戻る</button>
      </div>
    </section>

    <section id="reward" class="screen reward">
      <p class="reward-kicker">神 獣 契 約</p>
      <h2>新たな縁が結ばれた</h2>
      <article class="beast-card">
        <span class="rarity">稀少札　SR</span>
        <img src="assets/kagekui.png" alt="夢獏ムウ">
        <div><small>夢を食み、悪夢を祓う神獣</small><strong>夢獏 ムウ</strong><em>夢属性　　結び Lv.1</em></div>
      </article>
      <button id="keep-card" class="primary">札帳に収める</button>
    </section>

    <section id="book" class="screen book">
      <button id="book-close" class="close">×</button>
      <p class="reward-kicker">神 獣 札 帳</p><h2>結ばれた神獣</h2>
      <div class="book-grid">
        <article><img src="assets/kohaku.png" alt="炎狐コハク"><b>炎狐 コハク</b><span>炎属性　Lv.5</span></article>
        <article id="muu-entry" class="locked"><img src="assets/kagekui.png" alt="夢獏ムウ"><b>夢獏 ムウ</b><span>夢属性　Lv.1</span></article>
      </div>
      <p id="book-note">神獣との縁は、ここに刻まれる。</p>
    </section>
  </main>
  <script src="game.js?v=5"></script>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#071521"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>CODE BEASTS</title><link rel="manifest" href="manifest.json?v=1"><link rel="apple-touch-icon" href="assets/app_icon.png"><link rel="icon" href="assets/app_icon.png"><link rel="stylesheet" href="style.css?v=1"></head><body>
<link rel="stylesheet" href="battle.css?v=2"><div id="rotate"><b>端末を横向きにしてください</b><span>iPadでは横画面のまま遊べます</span></div>
<main id="game">
  <section id="start" class="screen active"><div class="logo"><small>DIGITAL CREATURE RPG</small><h1>CODE BEASTS</h1><p>失われた世界を、もう一度つなげ。</p></div><button id="begin">冒険をはじめる</button></section>
  <section id="choose" class="screen"><header><small>GENESIS LAB / PARTNER SELECT</small><h2>最初の相棒を選んでください</h2></header><div class="starters">
    <button data-pick="0"><i></i><b>イグニス</b><span>炎型 / 勇敢</span></button><button data-pick="1"><i></i><b>アクアロ</b><span>水型 / 好奇心</span></button><button data-pick="2"><i></i><b>リーフィ</b><span>植物型 / おだやか</span></button>
  </div><p id="choose-note">端末に眠る3体のデータ生命から、1体を起動します。</p></section>
  <section id="field" class="screen"><div id="world"><img src="assets/genesis_field.png" alt="ジェネシスフィールド"><img id="hero" src="assets/explorer.png" alt="主人公"><div id="partner"><img alt="相棒"></div><div id="wild-zone"></div></div><div class="topbar"><b>ジェネシス研究区</b><span id="objective">草むらを調査しよう</span></div><div id="stick"><i></i></div><button id="menu">≡</button></section>
  <section id="battle" class="screen"><div id="battle-flash"></div><div class="scan">WILD DATA DETECTED</div><div class="enemy"><div class="status"><b>ノイズラット <small>Lv.2</small></b><div class="hp"><i id="ehp"></i></div></div><img class="enemy-sprite" src="assets/noise_rat.png" alt="ノイズラット"></div><div class="ally"><img id="ally-art" alt="相棒"><div class="status"><b id="ally-name">PARTNER</b><div class="hp"><i id="ahp"></i></div><small id="ally-hp-text">28 / 28</small></div></div><div class="commands"><p id="message">野生データが実体化した！</p><div id="main-actions"><button id="fight"><b>たたかう</b><small>技を選ぶ</small></button><button id="capture"><b>リンク</b><small>弱らせて接続</small></button><button id="party"><b>チーム</b><small>相棒を交代</small></button><button id="bag"><b>バッグ</b><small>アイテム</small></button><button id="run"><b>にげる</b><small>探索へ戻る</small></button></div><div id="move-actions" class="hidden"><button data-hit="24"><b>データパルス</b><small>電脳　24/24</small></button><button data-hit="18"><b>クイックビット</b><small>無　30/30</small></button><button data-hit="30"><b>属性コード</b><small>属性　10/10</small></button><button data-hit="0"><b>解析</b><small>敵の状態を見る</small></button><button id="moves-back"><b>戻る</b></button></div></div></section>
</main><script src="game.js?v=7"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#071521"><title>CODE BEASTS</title><link rel="stylesheet" href="style.css?v=1"></head><body>
<div id="rotate"><b>端末を横向きにしてください</b><span>iPadでは横画面のまま遊べます</span></div>
<main id="game">
  <section id="start" class="screen active"><div class="logo"><small>DIGITAL CREATURE RPG</small><h1>CODE BEASTS</h1><p>失われた世界を、もう一度つなげ。</p></div><button id="begin">冒険をはじめる</button></section>
  <section id="choose" class="screen"><header><small>GENESIS LAB / PARTNER SELECT</small><h2>最初の相棒を選んでください</h2></header><div class="starters">
    <button data-pick="0"><i></i><b>イグニス</b><span>炎型 / 勇敢</span></button><button data-pick="1"><i></i><b>アクアロ</b><span>水型 / 好奇心</span></button><button data-pick="2"><i></i><b>リーフィ</b><span>植物型 / おだやか</span></button>
  </div><p id="choose-note">端末に眠る3体のデータ生命から、1体を起動します。</p></section>
  <section id="field" class="screen"><div id="world"><img src="assets/genesis_field.png" alt="ジェネシスフィールド"><img id="hero" src="assets/explorer.png" alt="主人公"><div id="partner"><i></i></div><div id="wild-zone"></div></div><div class="topbar"><b>ジェネシス研究区</b><span id="objective">草むらを調査しよう</span></div><div id="stick"><i></i></div><button id="menu">≡</button></section>
  <section id="battle" class="screen"><div class="scan">WILD DATA DETECTED</div><div class="enemy"><img class="enemy-sprite" src="assets/noise_rat.png" alt="ノイズラット"><b>ノイズラット　Lv.2</b><div class="hp"><i id="ehp"></i></div></div><div class="ally"><i id="ally-art"></i><b id="ally-name">PARTNER</b><div class="hp"><i></i></div></div><div class="commands"><p id="message">野生データが実体化した！</p><div><button data-hit="22">たたかう</button><button id="capture">リンク</button><button>バッグ</button><button id="run">にげる</button></div></div></section>
</main><script src="game.js?v=2"></script></body></html>

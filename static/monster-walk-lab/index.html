<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#102c38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="labo-icon.png">
  <link rel="apple-touch-icon" href="labo-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>LABO</title>
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <main class="app">
    <header>
      <div><small>CREATURE RESEARCH FACILITY</small><h1>LABO</h1></div>
      <button id="auto" class="mode active" type="button">自動さんぽ ON</button>
    </header>

    <section id="room" class="room" aria-label="モンスターが歩く部屋">
      <div class="window"><i></i><i></i></div>
      <div class="shelf"><i></i><i></i><i></i></div>
      <div class="plant">♣</div>
      <div class="rug"></div>
      <div id="thought" class="thought">♪</div>
      <div id="actor" class="actor moving dir-down">
        <div class="shadow"></div>
        <canvas id="sprite" class="sprite" width="362" height="362" aria-label="選択中のキャラクター"></canvas>
      </div>
      <p class="hint">床をタップすると、そこまで歩きます</p>
    </section>

    <section class="panel">
      <div class="monsters" role="group" aria-label="モンスター選択">
        <button class="monster active fire" data-monster="fire" type="button"><i></i><span>火</span><b>イグニス</b></button>
        <button class="monster water" data-monster="water" type="button"><i></i><span>水</span><b>アクアロ</b></button>
        <button class="monster nature" data-monster="nature" type="button"><i></i><span>緑</span><b>リーフィ</b></button>
        <button class="monster chankocchi" data-monster="chankocchi" type="button"><i></i><span>生命</span><b>ちゃんこっち</b></button>
      </div>
      <div class="controls" aria-label="方向操作">
        <button data-dir="up" type="button">▲</button>
        <button data-dir="left" type="button">◀</button>
        <button id="stop" type="button">●</button>
        <button data-dir="right" type="button">▶</button>
        <button data-dir="down" type="button">▼</button>
      </div>
      <div class="status"><b id="state">部屋を探検中</b><span>移動中は足踏み、止まると呼吸に切り替わります</span></div>
      <nav class="lab-nav" aria-label="LABO研究メニュー">
        <button data-lab="生成" type="button"><i>⬡</i><b>生成</b><small>新しい生命</small></button>
        <button data-lab="お世話" type="button"><i>♨</i><b>お世話</b><small>食事と観察</small></button>
        <button data-lab="部屋" type="button"><i>⌂</i><b>部屋</b><small>模様替え</small></button>
        <button data-lab="バトル" type="button"><i>⚔</i><b>バトル</b><small>能力実験</small></button>
        <button data-lab="街" type="button"><i>▦</i><b>街へ</b><small>冒険を始める</small></button>
      </nav>
    </section>
  </main>
  <section id="town" class="town-screen" hidden aria-label="始まりの街">
    <header class="town-topbar"><div><small>STARTING TOWN</small><b>はじまりの街・ミナモ町</b></div><button id="town-close" type="button" aria-label="LABOへ戻る">×</button></header>
    <div id="town-map" class="town-map">
      <canvas id="town-canvas" width="640" height="576" aria-label="ミナモ町のマップ"></canvas>
      <div id="town-hero" class="town-hero face-down" aria-label="仮の主人公"><i class="hero-head"></i><i class="hero-body"></i><i class="hero-feet"></i></div>
    </div>
    <div class="town-help"><b>ミナモ町</b><span>水辺から冒険が始まる、小さな研究の街。</span></div>
    <div class="town-pad" aria-label="街の移動操作"><button data-town-dir="up">▲</button><button data-town-dir="left">◀</button><button data-town-dir="down">▼</button><button data-town-dir="right">▶</button></div>
  </section>
  <section id="battle" class="battle-screen" hidden aria-label="モンスターバトル">
    <div class="battle-topbar"><b>LABO BATTLE</b><button id="battle-close" type="button">×</button></div>
    <div class="battle-field">
      <div class="battle-hud enemy-hud"><div><b>アクアロ</b><span>Lv.5　水</span></div><div class="hp-line"><small>HP</small><i><em id="enemy-hp"></em></i></div></div>
      <canvas id="enemy-battler" class="battler enemy-battler" width="320" height="320"></canvas>
      <div class="battle-platform enemy-platform"></div>
      <canvas id="player-battler" class="battler player-battler" width="320" height="320"></canvas>
      <div class="battle-platform player-platform"></div>
      <div class="battle-hud player-hud"><div><b>イグニス</b><span id="player-level">Lv.5　火</span></div><div class="hp-line"><small>HP</small><i><em id="player-hp"></em></i></div><strong><span id="player-hp-text">24</span> / <span id="player-hp-max">24</span></strong><div class="xp-line"><small>EXP</small><i><em id="player-xp"></em></i></div></div>
    </div>
    <div class="battle-console">
      <div id="battle-message" class="battle-message">アクアロが あらわれた！</div>
      <div id="battle-command" class="battle-command">
        <button data-command="fight" type="button">たたかう</button><button data-command="party" type="button">いれかえ</button>
        <button data-command="item" type="button">どうぐ</button><button data-command="run" type="button">にげる</button>
      </div>
      <div id="battle-moves" class="battle-moves" hidden>
        <button id="move-back" class="move-back" type="button">もどる</button>
      </div>
      <div id="move-learn" class="move-learn" hidden></div>
    </div>
  </section>
  <script src="app.js?v=22"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register(
            'service-worker.js', { updateViaCache: 'none' }
          );
          await registration.update();
        } catch (_) {
          // 更新確認が使えない環境でもLABO本体はそのまま起動する。
        }
      });
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17150f">
  <title>百兵戦図</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main>
    <header>
      <div><small>MINIATURE WAR LAB</small><h1>百兵戦図</h1></div>
      <div class="turn"><span id="phase">布陣完了</span><b id="clock">00:00</b></div>
    </header>
    <section class="score">
      <div class="army red"><span>朱雀軍</span><b><i id="redCount">50</i> / 50</b><div><em id="redBar"></em></div></div>
      <div class="versus">⚔</div>
      <div class="army blue"><span>蒼龍軍</span><b><i id="blueCount">50</i> / 50</b><div><em id="blueBar"></em></div></div>
    </section>
    <section class="battlefield" aria-label="50対50の戦場">
      <canvas id="war"></canvas>
      <div class="banner red-banner">朱</div><div class="banner blue-banner">蒼</div>
      <div class="notice" id="notice">両軍、進軍開始を待つ</div>
    </section>
    <section class="command">
      <button id="start" class="primary"><b>開戦</b><small>両軍進撃</small></button>
      <button data-order="advance"><b>全軍前進</b><small>圧力を強める</small></button>
      <button data-order="flank"><b>側面強襲</b><small>剣兵を回す</small></button>
      <button data-order="hold"><b>陣形維持</b><small>弓を活かす</small></button>
      <button id="reset"><b>再布陣</b><small>戦場を戻す</small></button>
    </section>
    <p class="legend"><span class="spear">◆ 槍兵20</span><span class="sword">● 剣兵20</span><span class="archer">▲ 弓兵10</span>　兵士は個別に戦い、部隊命令と士気で動きます</p>
  </main>
  <script src="game.js?v=1"></script>
</body>
</html>

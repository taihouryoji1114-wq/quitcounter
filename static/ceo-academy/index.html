<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08131c"><title>社長試験</title><link rel="stylesheet" href="style.css?v=1"></head>
<body><main>
<section id="home" class="screen active"><div class="seal">CEO<br><small>ACADEMY</small></div><p class="eyebrow">会社を守り、育てるための経営知識</p><h1>社長試験</h1><p class="lead">知らないまま継がない。<br>倒産を防ぐ知識を、いま身につける。</p><div class="stats"><div><small>習得率</small><b id="mastery">0%</b></div><div><small>最高連続</small><b id="best">0問</b></div><div><small>受験回数</small><b id="runs">0回</b></div></div><button id="begin" class="gold">試験を始める<span>全10問・解説付き</span></button><button id="review" class="ghost">間違えた問題を復習</button><div class="curriculum"><h2>経営の必修領域</h2><div id="categoryGrid"></div></div><p class="disclaimer">制度・期限は変更される場合があります。実務では税理士・社労士等の専門家と最新情報を確認してください。</p></section>
<section id="quiz" class="screen"><header><button id="quit">×</button><div><small id="category">資金繰り</small><b id="progressText">1 / 10</b></div><div class="streak">連続 <b id="streak">0</b></div></header><div class="progress"><i id="progressBar"></i></div><article class="question"><span id="level">基礎</span><h2 id="question"></h2><div id="answers"></div></article><footer><span>迷った問題も、解説で覚えれば前進。</span></footer></section>
<section id="explain" class="screen"><div id="resultMark" class="result-mark">✓</div><p id="resultTitle">正解</p><h2 id="answerTitle"></h2><div class="explanation"><h3>なぜ？</h3><p id="why"></p><h3>社長として覚えること</h3><p id="lesson"></p><a id="source" target="_blank" rel="noopener">公的資料を確認 ↗</a></div><button id="next" class="gold">次の問題へ</button></section>
<section id="finish" class="screen"><p class="eyebrow">EXAMINATION RESULT</p><div id="rank" class="rank">A</div><h2 id="score">8 / 10</h2><p id="summary"></p><div id="breakdown" class="breakdown"></div><button id="retry" class="gold">もう一度挑戦</button><button id="backHome" class="ghost">トップへ戻る</button></section>
</main><script src="game.js?v=1"></script></body></html>
